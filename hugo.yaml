# Hugo configuration file
title: Daniel Wessendorf
baseURL: "https://danielwessendorf.com/"

# import hextra as module
module:
  imports:
  - path: github.com/imfing/hextra

outputs:
  home: [HTML]
  page: [HTML]
  section: [HTML, RSS] 

services:
  googleAnalytics:
    ID: G-MT78F7N308

markup:
  highlight:
    noClasses: false
  # allow raw html
  goldmark:
    renderer:
      unsafe: true
    extensions:
      passthrough:
        delimiters:
          block: [['\[', '\]'], ['$$', '$$']]
          inline: [['\(', '\)']]
        enable: true

menu:
  main:
    - name: Workshops
      pageRef: /workshops
      weight: 2
    - name: Blog
      pageRef: /blog
      weight: 1
    - name: Talks
      pageRef: /talks
      weight: 3
    - name: About me
      pageRef: /about
      weight: 4
    - name: SAIN Labs
      url: "/#now"
      weight: 5
    - name: Search
      weight: 6
      params:
        type: search
    - name: GitHub
      weight: 7
      url: "https://github.com/dwessendorf"
      params:
        icon: github
    - name: Linkedin
      weight: 8
      url: "https://linkedin.com/in/daniel-wessendorf"
      params:
        icon: linkedin

params:
  description: "Data & AI architect and co-founder of SAIN Labs. Recipes, write-ups and talks on data streaming, cloud and AI."

  contact:
    email: d.wessendorf@gmail.com
    linkedin: "https://linkedin.com/in/daniel-wessendorf"
    github: "https://github.com/dwessendorf"

  theme:
    default: system
    displayToggle: true

  navbar:
    displayTitle: true
    displayLogo: true
    logo:
      path: images/logo.svg
      dark: images/logo-dark.svg
      # width: 40
      # height: 20
      # link: /
    # width: wide
      
      
  blog:
    list:
      displayTags: true
      # date | lastmod | publishDate | title | weight
      sortBy: date
      sortOrder: desc # or "asc"
    
    article:
      displayPagination: true


  footer:
    displayCopyright: true
    displayPoweredBy: false

  editURL:
    enable: true
    base: "https://github.com/dwessendorf/danielwessendorf.com/edit/main/content"
