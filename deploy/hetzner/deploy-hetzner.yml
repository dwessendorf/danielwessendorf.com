# Template, not active. Copy to .github/workflows/ to use it (see deploy/hetzner/README.md).
name: Deploy to Hetzner

on:
  workflow_dispatch:
  # Enable after the DNS cut-over:
  # push:
  #   branches: ["main"]

concurrency:
  group: hetzner-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.145.0
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Setup Hugo
        run: |
          wget -qO "$RUNNER_TEMP/hugo.deb" "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i "$RUNNER_TEMP/hugo.deb"

      - name: Build
        env:
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
        run: hugo --gc --minify --baseURL "https://danielwessendorf.com/"

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.HETZNER_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      # rrsync on the server maps the remote path "/" to the site's web root.
      - name: Upload
        env:
          HOST: ${{ secrets.HETZNER_HOST }}
        run: |
          rsync -rlpz --checksum --delete-after --delay-updates \
            --chmod=D755,F644 \
            public/ "deploy-dw@${HOST}:/"

      - name: Smoke test
        run: curl -fsS --retry 3 --retry-delay 5 -o /dev/null https://danielwessendorf.com/
